<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gold RV Intelligence: demo video</title>
<meta name="description" content="A full walkthrough of Gold RV Intelligence: every page, top to bottom, with real clicks. Team NEXORA, Hack in Hills '26.">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0E0A05; --fg: #F6EBD3; --muted: #BFAF92; --gold: #E5B04A; --line: rgba(229,176,74,.22); color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 400 16px/1.55 'Geist', system-ui, sans-serif; }
  body { min-height: 100vh; background: radial-gradient(120% 60% at 50% 0%, rgba(229,176,74,.14), rgba(229,176,74,0) 60%), var(--bg); }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 22px clamp(16px, 4vw, 40px) 48px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
  .brand { display: inline-flex; align-items: center; gap: 10px; color: var(--fg); text-decoration: none; font-weight: 700; }
  .glass { position: relative; overflow: hidden; border-radius: 22px; border: 1px solid rgba(229,176,74,.30);
    background: linear-gradient(180deg, rgba(229,176,74,.14), rgba(30,21,10,.66) 32%, rgba(18,13,6,.62));
    -webkit-backdrop-filter: blur(22px) saturate(150%); backdrop-filter: blur(22px) saturate(150%);
    box-shadow: inset 0 1px 0 rgba(255,236,190,.18), 0 24px 60px rgba(0,0,0,.38); }
  .glass::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 140px; pointer-events: none;
    background: radial-gradient(90% 100% at 50% 0%, rgba(240,197,102,.22), rgba(240,197,102,0) 72%); }
  .glass > * { position: relative; }
  .player { padding: clamp(12px, 2vw, 18px); }
  video { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; border-radius: 14px; background: #000; }
  h1 { margin: 0 0 4px; font-size: clamp(26px, 4vw, 38px); letter-spacing: -.02em; line-height: 1.15; }
  .sub { margin: 0 0 18px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; align-items: start; }
  .chapters { padding: 18px; }
  .chapters h2 { margin: 0 0 10px; font-size: 16px; }
  .chapters ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .chapters button { width: 100%; display: flex; gap: 12px; align-items: baseline; text-align: left; padding: 8px 10px; border-radius: 10px;
    border: 1px solid transparent; background: transparent; color: var(--fg); font: inherit; font-size: 14px; cursor: pointer; }
  .chapters button:hover, .chapters button[aria-current="true"] { border-color: rgba(229,176,74,.35); background: rgba(229,176,74,.10); color: var(--gold); }
  .chapters time { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: var(--muted); min-width: 38px; }
  .team { margin-top: 18px; padding: 16px 18px; text-align: center; }
  .team b { display: block; color: var(--gold); font-size: 20px; letter-spacing: -.01em; }
  .ctas { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn { min-height: 44px; padding: 0 18px; border-radius: 12px; display: inline-flex; align-items: center; text-decoration: none; font-weight: 600; font-size: 15px; }
  .btn.gold { background: linear-gradient(180deg, #F0C566, #DDA43C 55%, #C48A2A); color: #1B1305; }
  .btn.ghost { color: var(--fg); border: 1px solid rgba(229,176,74,.28); background: linear-gradient(180deg, rgba(255,236,190,.11), rgba(255,236,190,.03)); }
  .btn:focus-visible, .chapters button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .note { margin-top: 14px; font-size: 13px; color: var(--muted); }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="../?nointro">
      <svg width="34" height="22" viewBox="0 0 56 46" aria-hidden="true"><path d="M8 28L12 18H44L48 28Z M16 46L20 36H52L56 46Z" transform="translate(0 -10)" fill="#E5B04A"/></svg>
      Gold RV Intelligence
    </a>
    <nav class="ctas" aria-label="Leave the video">
      <a class="btn ghost" href="../intro/">Back to the intro</a>
      <a class="btn gold" href="../?nointro">Enter the site</a>
    </nav>
  </header>

  <h1>Demo video</h1>
  <p class="sub">The whole site on a laptop screen: every page from top to bottom, with real clicks. No sound.</p>

  <div class="grid">
    <div class="glass player">
      <video id="v" controls preload="metadata" playsinline src="gold-rv-demo-video.mp4">
        Your browser can't play this video. <a href="gold-rv-demo-video.mp4">Download it</a> instead.
      </video>
    </div>
    <aside class="glass chapters" aria-label="Chapters">
      <h2>Chapters</h2>
      <ol id="ch"></ol>
    </aside>
  </div>

  <div class="glass team">
    <b>Team NEXORA</b>
    Divyansh · Ishant Bhaudhira · Noni Gopal Das
    <div class="note">Hack in Hills '26 · Research project, not investment advice.</div>
  </div>
</div>
<script>
  // chapter start times (seconds), from the recording script
  var CH = [[0, 'Home'], [25, 'Today'], [44, 'Market'], [63, 'Pair Explorer'], [91, 'Signals'], [114, 'Backtesting'],
            [162, 'Try your own rule'], [184, 'Data'], [202, 'The brief, answered'], [210, 'Tools on every page']];
  var v = document.getElementById('v'), ol = document.getElementById('ch');
  function mmss(s) { return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
  CH.forEach(function (c, i) {
    var li = document.createElement('li'), b = document.createElement('button');
    b.type = 'button'; b.innerHTML = '<time>' + mmss(c[0]) + '</time><span>' + (i < 9 ? (i + 1) + '. ' : '') + c[1] + '</span>';
    b.addEventListener('click', function () { v.currentTime = c[0]; v.play && v.play().catch(function () {}); });
    li.appendChild(b); ol.appendChild(li);
  });
  v.addEventListener('timeupdate', function () {
    var t = v.currentTime, cur = 0; CH.forEach(function (c, i) { if (t >= c[0]) cur = i; });
    [].forEach.call(ol.querySelectorAll('button'), function (b, i) { b.setAttribute('aria-current', i === cur ? 'true' : 'false'); });
  });
</script>
</body>
</html>
